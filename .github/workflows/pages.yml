name: Publish study editor to GitHub Pages

# Manual only: enabling Pages and granting deployment permissions need owner approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=high
      - name: Build and verify at the Pages subpath
        run: npm run test:pages
      - name: Keep actual browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pages-browser-evidence
          path: test-results/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist-pages/

  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: false
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
