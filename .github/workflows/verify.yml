name: Verify study editor
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'THIRD_PARTY_LICENSES.txt']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'THIRD_PARTY_LICENSES.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Keep actual browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-acceptance-evidence
          path: |
            test-results/
            docs/evidence/
          retention-days: 14
